<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>MARINVA | Create Account</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="auth-page register-page"><div class="auth-photo register-photo"></div><div class="auth-overlay"></div><main class="register-layout"><section class="register-heading"><div class="marinva-logo"><span>M</span><div><strong>MARINVA</strong><small>MARITIME INTELLIGENCE</small></div></div><div><span class="auth-kicker">CREW & OPERATIONS ONBOARDING</span><h1>Join the maritime<br>operations network.</h1><p>Secure access for crew, vessel leadership and fleet operations.</p></div></section><section class="auth-card-wrap register-card"><div class="auth-card glass-card"><div class="auth-card-heading"><span>NEW MARINVA ACCOUNT</span><h2>Create account</h2></div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><div class="register-grid"><div class="auth-field"><label>Full name</label><input class="form-control" name="full_name" required></div><div class="auth-field"><label>Username</label><input class="form-control" name="username" required></div><div class="auth-field"><label>Password</label><input class="form-control" name="password" type="password" required></div><div class="auth-field"><label>Employee ID</label><input class="form-control" name="employee_id" required></div><div class="auth-field"><label>Role</label><select class="form-select" name="role"><option value="crew">Crew member</option><option value="engineer">Engineer</option><option value="deck officer">Deck officer</option><option value="safety officer">Safety officer</option><option value="electrical engineer">Electrical engineer</option><option value="captain">Captain</option><option value="fleet administrator">Fleet administrator</option></select></div><div class="auth-field"><label>Assigned vessel</label><select class="form-select" name="ship_id"><option value="">Select vessel</option>{% for ship in ships %}<option value="{{ ship.id }}">{{ ship.name }}</option>{% endfor %}</select></div><div class="auth-field"><label>Assigned responsibilities</label><textarea class="form-control" name="responsibilities" rows="2" placeholder="Role duties used to personalize assessments"></textarea></div></div><button class="auth-submit">Create secure account <span>→</span></button></form><div class="auth-footer"><small>Protected maritime workspace onboarding</small><a href="{{ url_for('login') }}">Back to sign in</a></div></div></section></main></body></html>
