<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARINVA | Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-header">
                <span class="brand-logo">M</span>
                <div>
                    <strong>MARINVA</strong>
                    <small>Training</small>
                </div>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('fleet_page') }}">Green Fleet</a>
                <a class="nav-link" href="{{ url_for('fuel_page') }}">AI Fuel</a>
                <a class="nav-link" href="{{ url_for('emergency_page') }}">Emergency</a>
                <a class="nav-link active" href="{{ url_for('training_page') }}">Training</a>
                <a class="nav-link" href="{{ url_for('reports_page') }}">Reports</a>
                <a class="nav-link" href="{{ url_for('profile_page') }}">Settings</a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="top-bar">
                <div><h4>AR-inspired crew training</h4></div>
                <div class="top-actions"><span class="badge badge-live">Demo certificate enabled</span></div>
            </header>

            <div class="content-wrap">
                <div class="row g-4 mb-4">
                    <div class="col-lg-5">
                        <div class="card">
                            <div class="card-header-row"><h5>Crew login</h5></div>
                            <form id="crewForm" class="row g-3">
                                <div class="col-12">
                                    <label>Crew profile</label>
                                    <select id="crewSelect" class="form-select">
                                        {% for crew in crews %}
                                        <option value="{{ crew.crew_id }}">{{ crew.full_name }} | {{ crew.role }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label>Language</label>
                                    <select id="langSelect" class="form-select">
                                        <option>English</option>
                                        <option>Hindi</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label>Training scenario</label>
                                    <select id="moduleSelect" class="form-select">
                                        {% for module in modules %}
                                        <option value="{{ module.code }}">{{ module.title }} ({{ module.language }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="card scene-card">
                            <div class="card-header-row"><h5>Training environment</h5></div>
                            <div class="training-scene">
                                <div class="hazard hazard-fire">Fire</div>
                                <div class="hazard hazard-gas">Gas</div>
                                <div class="hazard hazard-route">Route</div>
                                <div class="equipment">PPE kit</div>
                                <div class="equipment">Extinguisher</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-header-row"><h5>Assessment</h5></div>
                            <div id="questionBox" class="question-box"></div>
                            <div id="optionsBox" class="option-list"></div>
                            <div class="mt-3 d-flex gap-2">
                                <button id="submitAnswerBtn" class="btn btn-primary">Submit answer</button>
                                <button id="voiceBtn" class="btn btn-outline-secondary">Voice assist</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="card">
                            <div class="card-header-row"><h5>Progress & recommendations</h5></div>
                            <div id="trainingResult"></div>
                            <div id="certificateBox" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/training.js') }}"></script>
</body>
</html>
