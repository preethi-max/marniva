<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARINVA | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-shell">
        <div class="login-panel row g-0">
            <div class="col-lg-7 login-hero">
                <div class="brand-block">
                    <span class="brand-tag">MARINVA</span>
                    <h1>Maritime fleet intelligence and crew safety</h1>
                    <p>AI-powered sustainability, emergency coordination, and adaptive maritime training for modern vessel operations.</p>
                </div>
            </div>
            <div class="col-lg-5 login-form-panel">
                <div class="login-form-wrap">
                    <h2>Secure Access</h2>
                    <p class="text-muted">Operational portal</p>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" value="admin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" value="marinva123" required>
                        </div>
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="demo-credentials mt-3">
                        <small>Demo credentials: admin / marinva123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
