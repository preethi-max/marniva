<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARINVA | Emergency Coordination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-header">
                <span class="brand-logo">M</span>
                <div>
                    <strong>MARINVA</strong>
                    <small>Emergency</small>
                </div>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('fleet_page') }}">Green Fleet</a>
                <a class="nav-link" href="{{ url_for('fuel_page') }}">AI Fuel</a>
                <a class="nav-link active" href="{{ url_for('emergency_page') }}">Emergency</a>
                <a class="nav-link" href="{{ url_for('training_page') }}">Training</a>
                <a class="nav-link" href="{{ url_for('reports_page') }}">Reports</a>
                <a class="nav-link" href="{{ url_for('profile_page') }}">Settings</a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="top-bar">
                <div><h4>Emergency Coordination</h4></div>
                <div class="top-actions"><span class="badge badge-live">Decision support demo</span></div>
            </header>

            <div class="content-wrap">
                <div class="row g-4 mb-4">
                    <div class="col-lg-5">
                        <div class="card">
                            <div class="card-header-row"><h5>Incident setup</h5></div>
                            <form id="emergencyForm" class="row g-3">
                                <div class="col-12">
                                    <label>Affected vessel</label>
                                    <select id="affectedShip" class="form-select">
                                        {% for ship in ships %}
                                        <option value="{{ ship.id }}">{{ ship.name }} ({{ ship.vessel_id }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label>Emergency type</label>
                                    <select id="emergencyType" class="form-select">
                                        <option>Engine-room fire</option>
                                        <option>Gas leakage</option>
                                        <option>Flooding</option>
                                        <option>Engine failure</option>
                                        <option>Other emergency</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label>Weather</label>
                                    <select id="emergencyWeather" class="form-select">
                                        <option>Calm</option>
                                        <option>Moderate</option>
                                        <option>Rough</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-danger">Trigger alert</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-header-row"><h5>Simulated maritime map</h5></div>
                            <div class="map-panel">
                                <div class="map-point point-ship">A</div>
                                <div class="map-point point-ship blue">B</div>
                                <div class="map-point point-port">P</div>
                                <div class="map-point point-port green">P</div>
                                <div class="map-point point-port orange">P</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header-row"><h5>Recommended assisting vessels</h5></div>
                            <div id="assistingVessels"></div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header-row"><h5>Recommended ports</h5></div>
                            <div id="recommendedPorts"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/emergency.js') }}"></script>
</body>
</html>
